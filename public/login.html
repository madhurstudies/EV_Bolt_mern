<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · EV.Bolts</title>
  <meta name="description" content="Sign in to EV.Bolts to find EV charging stations in Pune and book a slot.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth">
  <div class="auth-bg" aria-hidden="true"></div>
  <div class="auth-scrim" aria-hidden="true"></div>

  <main class="auth-wrap">
    <section class="auth-panel">
      <a class="brand" href="/">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></span>
        EV.Bolts
      </a>

      <h1>Sign in</h1>
      <p class="lede">Find a charger near you and hold a slot for five minutes.</p>

      <form id="form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" placeholder="your_username" autofocus>
          <p class="err" data-for="username"></p>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password">
            <button type="button" class="reveal" aria-label="Show or hide password">Show</button>
          </div>
          <p class="err" data-for="password"></p>
        </div>
        <p class="form-error" role="alert"></p>
        <button class="btn primary block" type="submit">Sign in</button>
      </form>

      <p class="switch">New here? <a href="/signup">Create an account</a></p>
    </section>
  </main>

  <div class="credit">
    <button class="credit-btn" type="button" aria-label="Photo credit" aria-describedby="credit-text">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    </button>
    <p class="credit-text" id="credit-text">Photo: <a href="https://commons.wikimedia.org/wiki/File:Car2Go_Charging_Station_Stuttgart_2013_01.jpg" target="_blank" rel="noopener">Car2Go Charging Station Stuttgart 2013 01</a> by Julian Herzog, <a href="https://creativecommons.org/licenses/by/4.0" target="_blank" rel="noopener">CC BY 4.0</a>, via Wikimedia Commons</p>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
